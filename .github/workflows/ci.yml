name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить StyLua, Selene, Lune
        run: |
          mkdir -p bin
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v0.20.0/stylua-linux-x86_64.zip
          curl -sSL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.27.1/selene-0.27.1-linux.zip
          curl -sSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip
          unzip -o -q stylua.zip -d bin && unzip -o -q selene.zip -d bin && unzip -o -q lune.zip -d bin
          chmod +x bin/*
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Формат (StyLua)
        run: stylua --check src tests

      - name: Линтер (Selene)
        run: selene src

      - name: Тесты чистой логики (Lune)
        run: lune run tests/run.luau
